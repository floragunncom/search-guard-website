# GitLab CI/CD Pipeline for Search Guard Website
# Builds static site and deploys to Cloudflare Pages

stages:
  - build
  - deploy
  - cache

variables:
  NODE_VERSION: "26"
  CLOUDFLARE_PROJECT_NAME: "search-guard-website"
  LC_ALL: "C.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US.UTF-8"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

# Cache node_modules for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/


# Build job - runs for all branches
build:
  tags:
    - build
  stage: build
  image: node:${NODE_VERSION}
  script:
    - |
      set -euo pipefail
      echo "Installing dependencies..."
      npm ci --cache .npm --prefer-offline
      echo "Building static site ..."
      npm run build
      echo "Validating static output..."
      test -f out/index.html
      test -f out/sitemap.xml
      index_count="$(find out -name 'index.html' | wc -l | tr -d ' ')"
      echo "Found ${index_count} prerendered index.html files in out/"
      test "${index_count}" -gt 0
      #      if [ -n "${ALGOLIA_APP_ID:-}" ] && [ -n "${ALGOLIA_API_KEY:-}" ]; then
      #        echo "Running optional Algolia indexing..."
      #        if ! npm run indexBlogPosts -- --ALGOLIA_APP_ID="$ALGOLIA_APP_ID" --ALGOLIA_API_KEY="$ALGOLIA_API_KEY"; then
      #          echo "Warning: Algolia indexing failed, but build artifacts were created successfully."
      #        fi
      #      else
      #        echo "Skipping Algolia indexing because ALGOLIA_APP_ID/ALGOLIA_API_KEY are not set."
      #      fi
      mv out/ dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - branches
    - tags

# Deploy to Cloudflare Pages - Production (main branch)
deploy_production:
  tags:
    - build
  stage: deploy
  image: node:${NODE_VERSION}
  dependencies:
    - build
  before_script:
    - npm install -g wrangler
  script:
    - echo "Deploying to Cloudflare Pages (Production)..."
    - wrangler pages deploy dist --project-name=${CLOUDFLARE_PROJECT_NAME} --branch=cloudflare-migration --commit-hash=${CI_COMMIT_SHA} --commit-message="${CI_COMMIT_MESSAGE}"
    - echo "Production deployment complete!"
    - echo "Main URL - https://search-guard-website.pages.dev"
    - echo "Deployment URL - https://$(echo ${CI_COMMIT_SHA} | cut -c1-8).search-guard-website.pages.dev"
  #environment:
  #  name: migration
  #  url: https://coretex-axiom.pages.dev
  only:
    - cloudflare-migration
    # Temporary: also deploy the Turnstile branch to the staging env
    # (https://search-guard-website.pages.dev). Remove after merge.
    - 15-add-turnstile
  when: on_success

# Purge Cloudflare cache after production deployment
purge_cloudflare_cache:
  tags:
    - build
  stage: cache
  # TODO: Cache purge is disabled for now. To reactivate, replace the
  # `rules: - when: never` below with a branch-scoped rule, e.g.:
  #   rules:
  #     - if: '$CI_COMMIT_BRANCH == "cloudflare-migration"'
  #       when: on_success
  rules:
    - when: never #disabled for now
  image: curlimages/curl:latest
  dependencies: []
  script:
    - echo "Purging Cloudflare cache for production deployment..."
    - |
      if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "ERROR: CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN not set!"
        echo "Please configure these variables in GitLab CI/CD settings."
        exit 1
      fi
    - echo "Zone ID - ${CLOUDFLARE_ZONE_ID}"
    - |
      RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}')
    - echo "API Response - ${RESPONSE}"
    - |
      if echo "$RESPONSE" | grep -q '"success": true'; then
        echo "✓ Cache purged successfully!"
      else
        echo "✗ Cache purge failed!"
        echo "$RESPONSE"
        exit 1
      fi
  #environment:
  #  name: production