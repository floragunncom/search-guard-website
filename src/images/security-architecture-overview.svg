<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-sao-title sg-sao-desc">
<title id="sg-sao-title">Search Guard architecture: the plugin runs inside each Elasticsearch node and the Kibana plugin, authenticating requests against external identity providers</title>
<desc id="sg-sao-desc">Apps and services, Kibana and the sgctl command-line tool or REST API connect over TLS to an Elasticsearch cluster. Search Guard runs inside every node of that cluster, and the nodes talk to each other over TLS on the transport layer. The Search Guard Kibana plugin connects to the cluster over TLS as well. Search Guard authenticates and authorizes requests against identity providers such as LDAP or Active Directory, SAML, OpenID Connect and Kerberos, and writes security events to an audit log.</desc>
