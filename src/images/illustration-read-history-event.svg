<text x="1712" y="196" text-anchor="end" font-family="Material Icons" font-size="30" fill="#184962">close</text>
<rect x="208" y="234" width="1504" height="2" fill="#E8ECED"/><rect x="208" y="233" width="80" height="4" fill="#02F0DD"/>
<rect x="208" y="262" width="1504" height="64" fill="#e6fefc"/><text x="1688" y="300" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.2" font-size="19" fill="#184962">WHEN</text>
