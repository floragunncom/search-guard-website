<text x="868" y="755" text-anchor="end" font-size="19" letter-spacing="1.2" fill="#02F0DD">HASHED</text>
<text x="392" y="800" fill="#B0F8F2">country:</text><text x="568" y="800" fill="#FFFFFF">Germany</text>
<text x="392" y="844" fill="#B0F8F2">purchases:</text><text x="568" y="844" fill="#FFFFFF">12</text>
</g>

<!-- Panel B: compliance officer -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
<rect x="1020" y="570" width="540" height="300" rx="3" fill="#133346" stroke="#246E94" stroke-width="2"/>
<circle cx="1070" cy="620" r="22" fill="#02F0DD"/>
<text x="1070" y="633" text-anchor="middle" font-family="Material Icons" font-size="28" fill="#184962">person</text>
<text x="1108" y="628" font-family="Parafina-SemiWideBold, sans-serif" font-size="20" letter-spacing="0.4" fill="#FFFFFF">ROLE: COMPLIANCE OFFICER</text>
<rect x="1052" y="664" width="476" height="1" fill="#246E94"/>
<text x="1052" y="712" fill="#B0F8F2">name:</text><text x="1228" y="712" fill="#FFFFFF">Maria Keller</text>
<text x="1052" y="756" fill="#B0F8F2">email:</text><text x="1228" y="756" fill="#FFFFFF">maria.keller@example.com</text>
<text x="1052" y="800" fill="#B0F8F2">country:</text><text x="1228" y="800" fill="#FFFFFF">Germany</text>
