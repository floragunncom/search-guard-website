<g font-family="Inter-Regular, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#184962"><text x="1222" y="874">Watched fields <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#478EB3" font-weight="700">name</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#478EB3" font-weight="700">email</tspan></text><text x="1222" y="906">were part of the result — so the</text><text x="1222" y="938">read was recorded.</text></g>
