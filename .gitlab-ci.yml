# GitLab CI/CD Pipeline for Search Guard Website
# Builds static site and deploys to Cloudflare Pages

stages:
  - build
  - deploy
  - cache
  - index

variables:
  NODE_VERSION: "26"
  CLOUDFLARE_PROJECT_NAME: "search-guard-website"
  LC_ALL: "C.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US.UTF-8"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

# Cache node_modules for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/


# Build job - runs for all branches
build:
  tags:
    - build
  stage: build
  image: node:${NODE_VERSION}
  script:
    - |
      set -euo pipefail
      echo "Installing dependencies..."
      npm ci --cache .npm --prefer-offline
      echo "Building static site ..."
      npm run build
      echo "Validating static output..."
      test -f out/index.html
      test -f out/sitemap.xml
      index_count="$(find out -name 'index.html' | wc -l | tr -d ' ')"
      echo "Found ${index_count} prerendered index.html files in out/"
      test "${index_count}" -gt 0
      mv out/ dist/
  artifacts:
    paths:
      - dist/
      # Freshly fetched Contentful posts, consumed by the algolia_index job
      - src/Api/contentfulPosts.json
    expire_in: 1 hour
  only:
    - branches
    - tags

# Deploy to Cloudflare Pages - Production (master branch)
deploy_production:
  tags:
    - build
  stage: deploy
  image: node:${NODE_VERSION}
  dependencies:
    - build
  before_script:
    - npm install -g wrangler
  script:
    - echo "Deploying to Cloudflare Pages (Production)..."
    - wrangler pages deploy dist --project-name=${CLOUDFLARE_PROJECT_NAME} --branch=${CI_COMMIT_BRANCH} --commit-hash=${CI_COMMIT_SHA} --commit-message="${CI_COMMIT_MESSAGE}"
    - echo "Production deployment complete!"
    - echo "Main URL - https://search-guard-website.pages.dev"
    - echo "Deployment URL - https://$(echo ${CI_COMMIT_SHA} | cut -c1-8).search-guard-website.pages.dev"
  #environment:
  #  name: migration
  #  url: https://coretex-axiom.pages.dev
  only:
    - master
    - cloudflare-migration
  when: on_success

# Purge Cloudflare cache after a successful production deployment - master only
purge_cloudflare_cache:
  tags:
    - build
  stage: cache
  image: curlimages/curl:latest
  dependencies: []
  needs:
    - job: deploy_production
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
  script:
    - echo "Purging Cloudflare cache for production deployment..."
    - |
      if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "ERROR: CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN not set!"
        echo "Please configure these variables in GitLab CI/CD settings."
        exit 1
      fi
    - echo "Zone ID - ${CLOUDFLARE_ZONE_ID}"
    - |
      RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}')
    - echo "API Response - ${RESPONSE}"
    - |
      if echo "$RESPONSE" | grep -q '"success": true'; then
        echo "✓ Cache purged successfully!"
      else
        echo "✗ Cache purge failed!"
        echo "$RESPONSE"
        exit 1
      fi
  #environment:
  #  name: production

# Reindex blog posts in Algolia - master only, after a successful production deployment
algolia_index:
  tags:
    - build
  stage: index
  image: node:${NODE_VERSION}
  needs:
    # artifacts: true pulls in the freshly fetched src/Api/contentfulPosts.json
    - job: build
      artifacts: true
    - job: deploy_production
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
  # A failed reindex must not fail the deployment pipeline
  allow_failure: true
  script:
    - |
      set -euo pipefail
      if [ -z "${ALGOLIA_APP_ID:-}" ] || [ -z "${ALGOLIA_API_KEY:-}" ]; then
        echo "Skipping Algolia indexing because ALGOLIA_APP_ID/ALGOLIA_API_KEY are not set."
        exit 0
      fi
      echo "Installing dependencies..."
      npm ci --cache .npm --prefer-offline
      echo "Running Algolia indexing..."
      npm run indexBlogPosts -- --ALGOLIA_APP_ID="$ALGOLIA_APP_ID" --ALGOLIA_API_KEY="$ALGOLIA_API_KEY" --FORCE=true
