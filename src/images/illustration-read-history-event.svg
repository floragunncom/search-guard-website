<g stroke="#00B7A8" stroke-width="2.5" fill="none"><path d="M1052 874 H1062 V940 H1052"/><path d="M1062 907 H1150" stroke-dasharray="6 6"/></g><circle cx="1150" cy="907" r="6" fill="#00B7A8"/>
