<svg viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-icr-title sg-icr-desc">
<title id="sg-icr-title">Illustration of role management in the Search Guard configuration GUI</title>
<desc id="sg-icr-desc">A roles overview table in the Search Guard configuration GUI. Five example roles (analyst_team, finance_team, support_agent, etl_service, security_admin) are listed with their cluster permissions, index permissions such as read or write on index patterns, DLS and FLS markers, and the Kibana tenants they can access. A search field and a Create role button sit above the table.</desc>
