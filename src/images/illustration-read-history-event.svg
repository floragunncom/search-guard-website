<svg viewBox="136 96 1648 1008" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-irh-title sg-irh-desc">
<title id="sg-irh-title">Search Guard read history audit event</title>
<desc id="sg-irh-desc">Illustration of a read history audit event showing the user, the document and the watched fields that were read</desc>
