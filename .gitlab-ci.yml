# GitLab CI/CD Pipeline for Search Guard Website
# Builds the Next.js static export and deploys it to Cloudflare Pages.
#
# Pipeline shape per ref:
#   master                -> build -> deploy_cloudflare -> { purge_cloudflare_cache,
#                                                            algolia_index,
#                                                            cleanup_cloudflare_deployments }
#   any other branch      -> build -> deploy_cloudflare -> cleanup_cloudflare_deployments
#   Tag                   -> build                        (but see the caveat below)
#
# Every post-deploy job (stages `cache`, `index`, `cleanup`) is gated on deploy_cloudflare
# via `needs`, so they run concurrently and none of them can block or skip the others.
#
# Caveat - cleanup_cloudflare_deployments has no `only`/`except`, unlike the other two
# post-deploy jobs, so:
#   * it runs on every branch, not just master (N cleanups a day instead of one, and it
#     hard-exits when the Cloudflare variables are protected - see the note below);
#   * it is included in tag pipelines, where deploy_cloudflare (`only: - branches`) is
#     absent, so its `needs` target does not exist and GitLab fails pipeline *creation*.
#     No tags exist yet, so this is latent - fix it before the first one is pushed, with
#     `only: - master` + `except: - tags` or `optional: true` on the `needs` entry.
#
# Required GitLab CI/CD variables:
#   CLOUDFLARE_API_TOKEN   - wrangler auth, cache purge, deployment cleanup
#                            (deploy + purge + cleanup jobs)
#   CLOUDFLARE_ACCOUNT_ID  - wrangler auth (deploy job); also required by the cleanup job,
#                            which builds the Pages API URL by hand and so cannot resolve
#                            the account implicitly the way wrangler does
#   CLOUDFLARE_ZONE_ID     - cache purge target (purge job)
#   ALGOLIA_APP_ID         - optional; algolia_index self-skips when unset
#   ALGOLIA_API_KEY        - optional; algolia_index self-skips when unset
# Note: if these are marked "protected" in GitLab, master must be a protected
# branch or the jobs will see them as empty. This bites the cleanup job hardest,
# because it is the only post-deploy job that also runs on unprotected branches,
# where it fails on the empty-variable guard rather than skipping.

stages:
  - build
  - deploy
  # Post-deploy stages. Both are gated on deploy_cloudflare via `needs`, so they
  # run concurrently and neither waits on the other.
  - cache
  - index
  - cleanup

variables:
  # Node 24 (Krypton) is Active LTS through ~May 2028. Node 26 is still a
  # "Current" release, which upstream advises against for production.
  NODE_VERSION: "24"
  # Pin wrangler to a major version so a breaking release cannot land in a
  # deploy unreviewed. Minor/patch updates still come in automatically.
  WRANGLER_VERSION: "4"
  CLOUDFLARE_PROJECT_NAME: "search-guard-website"
  # The build shells out to Node scripts that emit UTF-8 content (Contentful
  # copy, sitemap); force a UTF-8 locale so they don't mangle it.
  LC_ALL: "C.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US.UTF-8"
  # Keep `npm ci` output focused on real errors.
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

# Shared npm cache. Keyed on package-lock.json so it is invalidated whenever
# dependencies change. Applies to every job; only the Node-image jobs use it.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/


# Build job - runs for every branch and tag.
# Deliberately branch-agnostic: no deploy/index/purge logic lives here, so a
# build behaves identically no matter where it runs.
build:
  tags:
    - build
  stage: build
  image: node:${NODE_VERSION}
  script:
    - |
      set -euo pipefail
      echo "Installing dependencies..."
      npm ci --cache .npm --prefer-offline
      # `npm run build` = fetch (Contentful -> src/Api/*.json) + next build + sitemap
      echo "Building static site ..."
      npm run build
      # Fail loudly on a silently empty/partial export rather than deploying it.
      echo "Validating static output..."
      test -f out/index.html
      test -f out/sitemap.xml
      index_count="$(find out -name 'index.html' | wc -l | tr -d ' ')"
      echo "Found ${index_count} prerendered index.html files in out/"
      test "${index_count}" -gt 0
      # Next exports to out/; wrangler is invoked against dist/ below.
      mv out/ dist/
  artifacts:
    paths:
      - dist/
      # Freshly fetched Contentful posts, consumed by the algolia_index job.
      # A copy is committed in git, but it goes stale - `npm run fetch` above
      # rewrites it, and this artifact overwrites the checkout downstream so we
      # index exactly the content we just deployed.
      - src/Api/contentfulPosts.json
    # Only needs to outlive the deploy/index jobs in the same pipeline.
    expire_in: 1 hour
  only:
    - branches

# Deploy to Cloudflare Pages - runs for every branch.
# Cloudflare routes it to production or to a preview based on --branch below.
# Keep it scoped no tighter than this: the two post-deploy jobs declare
# `needs: deploy_cloudflare`, and a `needs` pointing at a job absent from the
# pipeline is a hard YAML error that blocks pipeline creation entirely.
deploy_cloudflare:
  tags:
    - build
  stage: deploy
  image: node:${NODE_VERSION}
  # Pulls dist/ from the build job.
  dependencies:
    - build
  before_script:
    - npm install -g wrangler@${WRANGLER_VERSION}
  script:
    - echo "Deploying to Cloudflare Pages (Branch ${CI_COMMIT_BRANCH})..."
    # --branch drives Cloudflare's production-vs-preview routing: it is a
    # production deploy only when it matches the Pages project's configured
    # production branch. Branch pipelines only, so it is always set.
    - wrangler pages deploy dist --project-name=${CLOUDFLARE_PROJECT_NAME} --branch=${CI_COMMIT_BRANCH} --commit-hash=${CI_COMMIT_SHA} --commit-message="${CI_COMMIT_MESSAGE}"
    - echo "Deployment complete!"
    - echo "Main URL - https://search-guard-website.pages.dev"
    - echo "Deployment URL - https://$(echo ${CI_COMMIT_SHA} | cut -c1-8).search-guard-website.pages.dev"
  only:
    - branches
  when: on_success

# Purge the Cloudflare edge cache - master only, and only once new content is
# actually live. Purging on a branch that never deployed would just cost us a
# cold cache for nothing.
purge_cloudflare_cache:
  tags:
    - build
  stage: cache
  image: curlimages/curl:latest
  # No build artifacts needed - this job only talks to the Cloudflare API.
  dependencies: []
  needs:
    - job: deploy_cloudflare
      artifacts: false
  # `only` matches the ref *name*, so `except: - tags` is what keeps a tag named
  # "master" from matching and pulling in an absent deploy_cloudflare via `needs`.
  only:
    - master
  except:
    - tags
  script:
    - echo "Purging Cloudflare cache for production deployment..."
    # Fail fast with a clear message rather than sending an unauthenticated request.
    - |
      if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "ERROR: CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN not set!"
        echo "Please configure these variables in GitLab CI/CD settings."
        exit 1
      fi
    - echo "Zone ID - ${CLOUDFLARE_ZONE_ID}"
    # Full-zone purge: the static export rewrites hashed asset paths on every
    # build, so a targeted per-URL purge would not be meaningfully cheaper.
    - |
      RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}')
    - echo "API Response - ${RESPONSE}"
    # curl exits 0 on an HTTP error response, so the payload has to be inspected.
    - |
      # Cloudflare answers with compact JSON ("success":true), so do not expect a space here
      if echo "$RESPONSE" | grep -qE '"success":[[:space:]]*true'; then
        echo "✓ Cache purged successfully!"
      else
        echo "✗ Cache purge failed!"
        echo "$RESPONSE"
        exit 1
      fi

# Reindex blog posts in Algolia - master only, after a successful production
# deployment, so the search index never describes content that is not live yet.
algolia_index:
  tags:
    - build
  stage: index
  image: node:${NODE_VERSION}
  needs:
    # artifacts: true pulls in the freshly fetched src/Api/contentfulPosts.json,
    # which is the file the indexing script reads.
    - job: build
      artifacts: true
    # Gate on the deploy without pulling dist/ - this job does not need it.
    - job: deploy_cloudflare
      artifacts: false
  only:
    - master
  except:
    - tags
  # A stale search index is a real user-facing problem, so surface it as a red
  # pipeline rather than an easily-missed warning. Safe because this job is
  # terminal - nothing `needs` it and no stage follows `index`, so a failure
  # here blocks nothing. The deploy and cache purge have already completed.
  allow_failure: false
  script:
    - |
      set -euo pipefail
      # Algolia credentials are optional - skip cleanly instead of failing when
      # the variables are not configured. (`:-` is required under `set -u`.)
      if [ -z "${ALGOLIA_APP_ID:-}" ] || [ -z "${ALGOLIA_API_KEY:-}" ]; then
        echo "Skipping Algolia indexing because ALGOLIA_APP_ID/ALGOLIA_API_KEY are not set."
        exit 0
      fi
      echo "Installing dependencies..."
      npm ci --cache .npm --prefer-offline
      echo "Running Algolia indexing..."
      # --FORCE=true is required, not optional: indexBlogposts.js skips any post
      # whose sys.updatedAt is in the past, which is every published post, so
      # without it the job indexes nothing. Since this runs once per production
      # deploy, a full reindex is the intended behaviour.
      npm run indexBlogPosts -- --ALGOLIA_APP_ID="$ALGOLIA_APP_ID" --ALGOLIA_API_KEY="$ALGOLIA_API_KEY" --FORCE=true

# Housekeeping - delete old Cloudflare Pages deployments.
# Every branch pipeline creates a Pages deployment (see deploy_cloudflare) and Cloudflare keeps
# them forever, so without this job the project's deployment list grows without bound.
# Policy: delete everything older than RETENTION_DAYS, but always keep the newest deployment
# of each branch listed in KEEP_LATEST_BRANCHES, no matter how old it is.
cleanup_cloudflare_deployments:
  tags:
    - build
  stage: cleanup
  # alpine instead of curlimages/curl (used by purge_cloudflare_cache) because this job needs
  # jq for JSON parsing and date arithmetic, which that image does not ship.
  image: alpine:3
  dependencies: []
  # Runs as soon as deploy_cloudflare succeeded. Deliberately independent of
  # purge_cloudflare_cache and algolia_index so none of them can block or skip the others.
  # It has to run after the deploy so that today's deployment is the one kept as
  # "newest on release".
  needs:
    - job: deploy_cloudflare
      artifacts: false
  variables:
    # Deployments older than this are removed.
    RETENTION_DAYS: "14"
    # Space separated, exact branch names. The newest deployment of each of these is kept
    # regardless of its age.
    KEEP_LATEST_BRANCHES: "master main release"
    # Set to "true" (CI/CD settings, or a variable on "Run pipeline") to only list what would
    # be deleted without deleting anything.
    DRY_RUN: "false"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "ERROR: CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN not set!"
        echo "Please configure these variables in GitLab CI/CD settings."
        echo "NOTE: wrangler resolves the account id implicitly, plain curl cannot - so"
        echo "CLOUDFLARE_ACCOUNT_ID has to be set explicitly for this job."
        exit 1
      fi
    - echo "Project - ${CLOUDFLARE_PROJECT_NAME}"
    - echo "Retention - ${RETENTION_DAYS} days"
    - echo "Always keeping newest deployment of - ${KEEP_LATEST_BRANCHES}"
    - echo "Dry run - ${DRY_RUN}"
    - |
      set -e
      API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments"

      ## 1. Collect every deployment, page by page.
      # per_page is not honoured reliably by this endpoint, so stop on the first empty page
      # instead of computing a page count from result_info. PAGE_LIMIT is a runaway guard only.
      echo "[]" > all_deployments.json
      PAGE=1
      PAGE_LIMIT=200
      while [ "$PAGE" -le "$PAGE_LIMIT" ]; do
        RESPONSE=$(curl -sS -X GET "${API}?page=${PAGE}&per_page=25" \
          -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
          -H "Content-Type: application/json")

        if ! echo "$RESPONSE" | jq -e '.success == true' > /dev/null 2>&1; then
          echo "✗ Failed to list deployments (page ${PAGE})"
          echo "$RESPONSE"
          exit 1
        fi

        COUNT=$(echo "$RESPONSE" | jq '.result | length')
        [ "$COUNT" -eq 0 ] && break

        echo "$RESPONSE" | jq '.result' > page.json
        jq -s 'add' all_deployments.json page.json > merged.json
        mv merged.json all_deployments.json
        PAGE=$((PAGE + 1))
      done

      echo "Total deployments found - $(jq 'length' all_deployments.json)"

      ## 2. Work out what to delete.
      # Kept are all deployments newer than the cutoff plus the newest deployment of each
      # protected branch (whatever its age). created_on can carry fractional seconds, which
      # fromdateiso8601 cannot parse, so strip them first.
      jq -r \
        --argjson days "${RETENTION_DAYS}" \
        --arg keep "${KEEP_LATEST_BRANCHES}" '
        ($keep | split(" ")) as $keepbranches
        | (now - ($days * 86400)) as $cutoff
        | map({
            id: .id,
            branch: (.deployment_trigger.metadata.branch // "unknown"),
            created_on: .created_on,
            created: (.created_on | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
          })
        | ( [ .[] | select(.branch as $b | $keepbranches | index($b)) ]
            | group_by(.branch)
            | map(max_by(.created).id) ) as $protected
        | .[]
        | select(.created < $cutoff)
        | select(.id as $i | $protected | index($i) | not)
        | "\(.id)\t\(.branch)\t\(.created_on)"
      ' all_deployments.json > to_delete.tsv

      DELETE_COUNT=$(wc -l < to_delete.tsv | tr -d ' ')
      echo "Deployments to delete - ${DELETE_COUNT}"

      if [ "$DELETE_COUNT" -eq 0 ]; then
        echo "✓ Nothing to clean up"
        exit 0
      fi

      ## 3. Delete them.
      # Cloudflare refuses to delete the live production deployment (error 8000034) and
      # aliased deployments (8000035). That is a welcome second safety net on top of the
      # branch guard above, so a rejection is logged and skipped rather than failing the job.
      # No force=true is passed, on purpose - it would defeat exactly that safety net.
      set +e
      DELETED=0
      SKIPPED=0
      while IFS="$(printf '\t')" read -r ID BRANCH CREATED; do
        [ -z "$ID" ] && continue
        if [ "$DRY_RUN" = "true" ]; then
          echo "  [dry-run] would delete ${ID} - branch ${BRANCH} - created ${CREATED}"
          DELETED=$((DELETED + 1))
          continue
        fi
        DEL=$(curl -sS -X DELETE "${API}/${ID}" \
          -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
          -H "Content-Type: application/json")
        if echo "$DEL" | jq -e '.success == true' > /dev/null 2>&1; then
          echo "  deleted ${ID} - branch ${BRANCH} - created ${CREATED}"
          DELETED=$((DELETED + 1))
        else
          echo "  skipped ${ID} - branch ${BRANCH} - $(echo "$DEL" | jq -c '.errors' 2>/dev/null || echo "$DEL")"
          SKIPPED=$((SKIPPED + 1))
        fi
      done < to_delete.tsv

      if [ "$DRY_RUN" = "true" ]; then
        echo "✓ Housekeeping dry run done - would delete ${DELETED}, nothing was changed"
      else
        echo "✓ Housekeeping done - deleted ${DELETED}, skipped ${SKIPPED}"
      fi
