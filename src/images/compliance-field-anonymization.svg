</g>

<!-- Caption -->
<rect x="920" y="920" width="80" height="5" fill="#02F0DD"/>
<text x="960" y="982" text-anchor="middle" font-family="Parafina-SemiWideBold, sans-serif" font-size="32" letter-spacing="0.4" fill="#FFFFFF">SAME DATA, DIFFERENT VIEWS.</text>
</svg>
