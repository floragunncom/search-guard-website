<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-caf-title sg-caf-desc">
<title id="sg-caf-title">Search Guard audit event routing</title>
<desc id="sg-caf-desc">Search Guard audit events flow from the Elasticsearch cluster to multiple storage endpoints: an internal or immutable audit index, an external cluster, a SIEM via webhook, and log4j appenders</desc>
<defs>
<marker id="sg-caf-ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00B7A8"/></marker>
<marker id="sg-caf-ah-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#478EB3"/></marker>
<marker id="sg-caf-ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#184962"/></marker>
<clipPath id="sg-caf-helmet-clip"><rect width="86" height="116" transform="translate(0 0.160645)"/></clipPath>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

