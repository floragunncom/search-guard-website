<text x="240" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.2" font-size="19" fill="#63737E">audit_category</text><text x="900" y="366" font-family="Inter-Regular, -apple-system, sans-serif" font-size="21" font-weight="500" fill="#184962">COMPLIANCE_DOC_READ</text>
<rect x="208" y="390" width="1504" height="64" fill="#e6fefc"/><text x="1688" y="428" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.2" font-size="19" fill="#184962">WHO</text>
