image: node:20-bookworm
variables:
  LC_ALL: "C.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US.UTF-8"
  # Prevent Puppeteer from downloading Chrome (using system version)
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

.build: &build
  artifacts:
    paths:
      - dist
    expire_in: 1 day
  script:
    - |
      set -e
      echo "Building with Node $(node --version) and npm $(npm --version)"

      # Install dependencies required for Puppeteer
      # Updated for Debian Bookworm (Node 20 image)
      apt-get update && apt-get install -y \
        ca-certificates \
        fonts-liberation \
        libasound2 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libc6 \
        libcairo2 \
        libcups2 \
        libdbus-1-3 \
        libexpat1 \
        libfontconfig1 \
        libgbm1 \
        libgcc1 \
        libglib2.0-0 \
        libgtk-3-0 \
        libnspr4 \
        libnss3 \
        libpango-1.0-0 \
        libpangocairo-1.0-0 \
        libstdc++6 \
        libx11-6 \
        libx11-xcb1 \
        libxcb1 \
        libxcomposite1 \
        libxcursor1 \
        libxdamage1 \
        libxext6 \
        libxfixes3 \
        libxi6 \
        libxrandr2 \
        libxrender1 \
        libxss1 \
        libxtst6 \
        lsb-release \
        wget \
        xdg-utils \
      && rm -rf /var/lib/apt/lists/*

      # Install npm dependencies
      npm ci --legacy-peer-deps

      # Run build (includes Vite build, SSG with Puppeteer, SEO injection, and sitemap)
      npm run build

      # Index blog posts to Algolia
      npm run indexBlogPosts -- --ALGOLIA_APP_ID=$ALGOLIA_APP_ID --ALGOLIA_API_KEY=$ALGOLIA_API_KEY

      # Verify build output
      echo "Build complete. Checking dist directory..."
      ls -lh dist/ | head -20
      echo "Total files in dist:"
      find dist -type f | wc -l
.deploy: &deploy
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq lftp openssh-client
    - echo "Building branch $CI_COMMIT_REF_NAME"
    - echo "Set SSH configuration for SFTP"
    - eval $(ssh-agent -s)
    - echo "$sftp_user_private_key_base64" | base64 -d | tr -d '\r' | ssh-add -
  script:
    - |
      echo "Uploading files to SFTP server $sftp_server for host: $website_host"
      lftp --version
      echo "Start SFTP upload from dist/ directory"
      lftp -u $sftp_user_name, -e "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no'; mirror --reverse --delete --parallel=20 --verbose dist/ /var/www/$website_host/html/; quit" sftp://$sftp_server

stages:
  - build
  - deploy
  - post_deploy


build_prod:
  tags:
    - build
  stage: build
  only:
    - master
  <<: *build



deploy_to_prod:
  image: ubuntu:22.04
  tags:
    - build
  stage: deploy
  dependencies:
    - build_prod
  only:
    - master
  variables:
    website_host: search-guard.com    
  <<: *deploy

flush_cloudflare_cache:
  image: ubuntu:22.04
  tags:
    - build
  stage: post_deploy
  only:
   - master
  script:
    - |
      apt update && apt-get install -y curl
      if [ ! ${SG_CLOUDFLARE_ZONEID+x} ];  then
        SG_CLOUDFLARE_ZONEID=21f0b97bf3df0f55bba6ca46b746da1f
      fi
      if [ ! ${REMOVE_CLOUDFLARE_CACHE+x} ];  then
        REMOVE_CLOUDFLARE_CACHE=true
      fi

      if $REMOVE_CLOUDFLARE_CACHE ; then
         echo "Deleting Cloudflare Cache"
         curl --fail-with-body \
         -X POST "https://api.cloudflare.com/client/v4/zones/$SG_CLOUDFLARE_ZONEID/purge_cache" \
         -H "Authorization: Bearer $SG_CLOUDFLARE_DECACHE_TOKEN" \
         -H "Content-Type: application/json" \
         --data '{"purge_everything":true}'
      fi
