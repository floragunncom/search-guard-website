<text x="448" y="628" font-family="Parafina-SemiWideBold, sans-serif" font-size="20" letter-spacing="0.4" fill="#FFFFFF">ROLE: ANALYST</text>
<rect x="392" y="664" width="476" height="1" fill="#246E94"/>
<text x="392" y="712" fill="#B0F8F2">name:</text>
