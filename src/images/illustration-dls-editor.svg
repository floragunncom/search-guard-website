<svg viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-ide-title sg-ide-desc">
<title id="sg-ide-title">Illustration of a role definition with a document-level security query</title>
<desc id="sg-ide-desc">An edit dialog for the Search Guard role finance_team. Under index permissions the index pattern finance-* is allowed the SGS_READ action, a document-level security query restricts results to documents whose department field matches the user attribute department, and field-level security excludes the iban and salary fields. A note explains that each user sees only the documents of their own department.</desc>
<rect width="1920" height="1200" fill="#FFFFFF"/>
<rect x="120" y="120" width="1680" height="920" rx="3" fill="#FFFFFF" stroke="#E8ECED" stroke-width="1.5"/>
<text x="168" y="220" font-family="Material Icons" font-size="38" fill="#00B7A8">edit</text><text x="222" y="212" font-family="Parafina-SemiWideXBold, sans-serif" font-size="34" fill="#184962">EDIT ROLE:</text><text x="391" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#184962">finance_team</text><text x="1752" y="214" text-anchor="end" font-family="Material Icons" font-size="32" fill="#184962">close</text>
<rect x="168" y="258" width="1584" height="2" fill="#E8ECED"/><rect x="168" y="257" width="80" height="4" fill="#02F0DD"/>
<text x="168" y="334" font-family="Material Icons" font-size="28" fill="#00B7A8">folder_open</text><text x="208" y="328" font-family="Parafina-SemiWideBold, sans-serif" letter-spacing="0.4" font-size="20" fill="#184962">INDEX PERMISSIONS</text>
<text x="168" y="410" font-family="Inter-Regular, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#63737E">Index patterns</text>
<rect x="560" y="378" width="540" height="52" rx="3" fill="#FFFFFF" stroke="#E8ECED" stroke-width="1.5"/><text x="580" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#184962">finance-*</text>
<text x="168" y="498" font-family="Inter-Regular, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#63737E">Allowed actions</text>
<rect x="560" y="475" width="160" height="34" rx="17" fill="#FFFFFF" stroke="#478EB3" stroke-width="2"/><text x="580" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.2" font-size="20" fill="#184962">SGS_READ</text>
<text x="168" y="588" font-family="Inter-Regular, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#63737E">Document-level security query</text>
<rect x="560" y="556" width="740" height="170" rx="3" fill="#E8ECED" fill-opacity="0.35" stroke="#E8ECED" stroke-width="1.5"/>
<rect x="920" y="626" width="341" height="34" rx="2" fill="#B0F8F2" fill-opacity="0.35"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#184962"><text x="592" y="604">{</text><text x="617.2" y="650"><tspan fill="#478EB3" font-weight="700">"term"</tspan>: { <tspan fill="#478EB3" font-weight="700">"department"</tspan>: <tspan font-weight="700">"${user.attrs.department}"</tspan> }</text><text x="592" y="696">}</text></g>
<g stroke="#00B7A8" stroke-width="2.5" fill="none"><path d="M924 666 V690 H1257 V666"/><path d="M1091 690 V760 H1370" stroke-dasharray="6 6"/></g><circle cx="1370" cy="760" r="6" fill="#00B7A8"/>
<text x="1394" y="772" font-family="Material Icons" font-size="30" fill="#00B7A8">visibility</text><g font-family="Inter-Regular, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#184962"><text x="1438" y="766">Each user sees only the</text><text x="1438" y="798">documents of their own</text><text x="1438" y="830">department.</text></g>
<text x="168" y="830" font-family="Inter-Regular, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#63737E">Field-level security</text>
<rect x="560" y="807" width="124" height="34" rx="3" fill="#184962"/><text x="622" y="830" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.2" font-size="20" fill="#FFFFFF">EXCLUDE</text>
<rect x="702" y="807" width="107" height="34" rx="17" fill="#FFFFFF" stroke="#478EB3" stroke-width="2"/><text x="722" y="830" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.2" font-size="20" fill="#184962">iban</text><text x="779" y="833" font-family="Material Icons" font-size="18" fill="#63737E">close</text>
<rect x="821" y="807" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#478EB3" stroke-width="2"/><text x="841" y="830" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.2" font-size="20" fill="#184962">salary</text><text x="925" y="833" font-family="Material Icons" font-size="18" fill="#63737E">close</text>
<rect x="168" y="900" width="1584" height="1.5" fill="#E8ECED"/>
<rect x="1350" y="940" width="180" height="56" rx="3" fill="#FFFFFF" stroke="#184962" stroke-width="2"/><text x="1440" y="975" text-anchor="middle" font-family="Parafina-SemiWideBold, sans-serif" letter-spacing="0.4" font-size="20" fill="#184962">CANCEL</text>
<rect x="1550" y="940" width="202" height="56" rx="3" fill="#184962"/><text x="1574" y="979" font-family="Material Icons" font-size="26" fill="#02F0DD">check</text><text x="1610" y="975" font-family="Parafina-SemiWideBold, sans-serif" letter-spacing="0.4" font-size="20" fill="#FFFFFF">SAVE ROLE</text>
</svg>
