image: node:20.18.1
variables:
  LC_ALL: "C.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US.UTF-8"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

.build: &build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm config set cache .npm --global
  artifacts:
    paths:
      - out
    expire_in: 7 days
  script:
    - |
      set -euo pipefail
      npm ci
      npm run build
      echo "Validating static output..."
      test -f out/index.html
      test -f out/sitemap.xml
      index_count="$(find out -name 'index.html' | wc -l | tr -d ' ')"
      echo "Found ${index_count} prerendered index.html files in out/"
      test "${index_count}" -gt 0
      if [ -n "${ALGOLIA_APP_ID:-}" ] && [ -n "${ALGOLIA_API_KEY:-}" ]; then
        echo "Running optional Algolia indexing..."
        if ! npm run indexBlogPosts -- --ALGOLIA_APP_ID="$ALGOLIA_APP_ID" --ALGOLIA_API_KEY="$ALGOLIA_API_KEY"; then
          echo "Warning: Algolia indexing failed, but build artifacts were created successfully."
        fi
      else
        echo "Skipping Algolia indexing because ALGOLIA_APP_ID/ALGOLIA_API_KEY are not set."
      fi
.deploy: &deploy
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq lftp openssh-client
    - echo "Building branch $CI_COMMIT_REF_NAME"
    - echo "Set SSH configuration for SFTP"
    - eval $(ssh-agent -s)
    - echo "$sftp_user_private_key_base64" | base64 -d | tr -d '\r' | ssh-add -
  script:
    - |
      echo "Uploading files to SFTP server $sftp_server for host: $website_host"
      lftp --version
      echo "Start SFTP upload"
      lftp -u $sftp_user_name, -e "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no'; mirror --reverse --delete --parallel=20 --verbose out/ /var/www/$website_host/html/; quit" sftp://$sftp_server

stages:
  - build
  - deploy
  - post_deploy


build_prod:
  tags:
    - build
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  <<: *build



deploy_to_prod:
  image: ubuntu:22.04
  tags:
    - build
  stage: deploy
  dependencies:
    - build_prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    website_host: search-guard.com    
  <<: *deploy

flush_cloudflare_cache:
  image: ubuntu:22.04
  tags:
    - build
  stage: post_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - |
      apt update && apt-get install -y curl
      if [ ! ${SG_CLOUDFLARE_ZONEID+x} ];  then
        SG_CLOUDFLARE_ZONEID=21f0b97bf3df0f55bba6ca46b746da1f
      fi
      if [ ! ${REMOVE_CLOUDFLARE_CACHE+x} ];  then
        REMOVE_CLOUDFLARE_CACHE=true
      fi

      if $REMOVE_CLOUDFLARE_CACHE ; then
         echo "Deleting Cloudflare Cache"
         curl --fail-with-body \
         -X POST "https://api.cloudflare.com/client/v4/zones/$SG_CLOUDFLARE_ZONEID/purge_cache" \
         -H "Authorization: Bearer $SG_CLOUDFLARE_DECACHE_TOKEN" \
         -H "Content-Type: application/json" \
         --data '{"purge_everything":true}'
      fi
